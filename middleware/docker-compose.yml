services:
  postgres:
    image: postgres:17-alpine
    container_name: rag-middleware-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - rag_middleware_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rag_middleware_postgres_data:
